version: 2
updates:
  - package-ecosystem: npm
    directory: /hydrogen
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # Keep related tooling in a single PR instead of dozens of separate ones.
      storybook:
        patterns: ['storybook', '@storybook/*', '@chromatic-com/storybook']
      eslint:
        patterns: ['eslint', '@eslint/*', 'eslint-*', '@typescript-eslint/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', 'playwright', '@playwright/*', 'jsdom']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      dev-minor-patch:
        dependency-type: development
        update-types: ['minor', 'patch']
    ignore:
      # Major upgrades are breaking by definition and the theme ships a tested dependency
      # matrix. They land deliberately via `h2 upgrade` or a dedicated PR, not automatically.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Hydrogen and the Shopify CLI use calendar versioning and are upgraded deliberately.
      - dependency-name: '@shopify/hydrogen'
      - dependency-name: '@shopify/cli'

  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ['dependencies', 'ci']
    commit-message:
      prefix: 'chore(ci)'
