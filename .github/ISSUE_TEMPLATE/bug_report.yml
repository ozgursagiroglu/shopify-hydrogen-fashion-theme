name: Bug report
description: Something in the theme is broken or behaves unexpectedly
title: '[Bug]: '
labels: ['bug', 'needs triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do **not** use this form for security vulnerabilities —
        follow [SECURITY.md](../blob/main/SECURITY.md) instead.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - Homepage / sections
        - Collection / filtering
        - Product detail page
        - Cart / checkout
        - Search
        - Account
        - i18n / RTL
        - Setup wizard or seeding (scripts/)
        - Build / tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: 'v20.19.0'
    validations:
      required: true

  - type: input
    id: package-manager
    attributes:
      label: Package manager and version
      placeholder: 'yarn 1.22.22'
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: 'Chrome 130 on macOS 15'

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I am not including any real credentials, tokens, or `.env` contents
          required: true
